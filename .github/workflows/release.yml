name: release

# Релиз создаётся при изменении файла VERSION (тег берётся из его содержимого)
# или вручную через workflow_dispatch. Job сам создаёт git-тег и публикует
# бинарники в GitHub Releases (permissions: contents: write).
on:
  push:
    branches: ["**"]
    paths: ["VERSION"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0); created if it does not exist"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run tests
        run: go test ./...
      - name: Cross-compile all platforms
        run: sh build.sh
      - name: Determine release tag
        id: ver
        run: |
          tag="${{ github.event.inputs.tag }}"
          [ -n "$tag" ] || tag="$(cat VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
